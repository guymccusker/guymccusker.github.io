name: Build and deploy site

on:
  push:
    branches: [main]
  schedule:
    # Re-fetch publications weekly even if nothing else changed, so new
    # papers from the Research Portal show up without a manual push.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Emacs
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: pip install beautifulsoup4

      - name: Refresh publications list from Research Portal
        run: |
          python3 scripts/fetch_publications.py \
            --feed-url "https://researchportal.bath.ac.uk/en/persons/guy-mccusker/publications/?format=rss" \
            --out content/publications.org \
            --highlight-name McCusker

      - name: Build site with org-publish
        run: emacs --batch -l publish.el --eval '(org-publish "site" t)'

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
